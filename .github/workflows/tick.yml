# Penjadwal utama untuk candle 1 jam. Menit 7, 22, 37, 52 (bukan menit 0) karena jadwal
# GitHub sering terlambat. Panggilan kedua dst. untuk candle yang sama ditolak oleh
# idempotency bot, jadi panggilan cadangan hanya berguna bila panggilan pertama telat/gagal.
# Secrets repo: TICK_URL (https://<proyek>.vercel.app/api/tick) dan CRON_SECRET.
name: tick
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Panggil /api/tick
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --retry 2 --retry-delay 20 --max-time 290 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${TICK_URL}?src=github-actions"
