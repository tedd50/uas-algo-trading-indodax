<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantitative Trading Research Terminal | Trend Following IDX Kompas100</title>
<style>:root{--bg:#080D16;--side:#0D1420;--card:#111B2B;--elev:#172235;--acc:#4F8CFF;--acc2:#22D3EE;--pos:#00D6A0;--neg:#FF5C75;--warn:#F5B942;--tx:#EAF0FA;--tx2:#8A9BB5;--bd:#243249;--r:12px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.num,td.n,.kv{font-variant-numeric:tabular-nums}
#app{display:flex;min-height:100vh}
#side{width:224px;background:var(--side);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow:auto;flex:none;transition:width .2s}
#side.c{width:62px}#side.c .lb,#side.c .brand span{display:none}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 12px;font-weight:700;letter-spacing:.02em}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));flex:none}
.nav a{display:flex;gap:12px;align-items:center;padding:9px 18px;color:var(--tx2);text-decoration:none;cursor:pointer;border-left:3px solid transparent;font-size:13px}
.nav a:hover{background:#121c2e;color:var(--tx)}.nav a.on{color:var(--tx);background:#14203a;border-left-color:var(--acc)}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.85}
#main{flex:1;min-width:0}
#top{position:sticky;top:0;z-index:20;background:rgba(8,13,22,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
#top .t1{font-weight:700;font-size:15px}#top .m{color:var(--tx2);font-size:12px}#top .m b{color:var(--tx);font-weight:600}
.btn{background:var(--elev);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;border:1px solid var(--bd);color:var(--tx2);margin-right:6px}
.chip.a{border-color:var(--acc);color:var(--acc)}.chip.w{border-color:var(--warn);color:var(--warn)}.chip.p{border-color:var(--pos);color:var(--pos)}.chip.n{border-color:var(--neg);color:var(--neg)}
#view{padding:20px;max-width:1500px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:26px 0 10px}h3{font-size:13px;margin:0 0 8px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--tx2);margin:0 0 16px}
.grid{display:grid;gap:12px}.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;min-width:0}
.kpi .l{color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}.kpi .s{color:var(--tx2);font-size:11px;margin-top:2px}
.kpi.sm .v{font-size:18px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.neu{color:var(--acc)}.warn{color:var(--warn)}.mut{color:var(--tx2)}
[data-tip]{position:relative;cursor:help}
#tip{position:fixed;z-index:99;pointer-events:none;background:#0b1322;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:12px;max-width:320px;display:none;box-shadow:0 6px 24px #0008}
#tip b{color:var(--acc2)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--tx2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--card)}
th.s{cursor:pointer}td.r,th.r{text-align:right}
.tw{overflow:auto;max-height:560px;border-radius:8px}
tr:hover td{background:#14203266}
.hm td{text-align:center;padding:7px 4px;border:1px solid var(--bg);min-width:54px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input,select,textarea{background:var(--elev);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px}
textarea{width:100%;min-height:90px}
.box{border-left:3px solid var(--acc);background:#0f1a2d;padding:10px 14px;border-radius:6px;margin:10px 0;font-size:13px}
.box.w{border-color:var(--warn)}.box.n{border-color:var(--neg)}.box.p{border-color:var(--pos)}
.fwd{border:1px dashed var(--warn);background:#16140c;border-radius:var(--r);padding:14px}
svg text{fill:var(--tx2);font-size:11px;font-family:inherit}
.legend{display:flex;gap:12px;font-size:12px;color:var(--tx2)}.legend span{cursor:pointer;user-select:none}.legend span.off{opacity:.35;text-decoration:line-through}
.legend i{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle}
ul{margin:6px 0 6px 18px;padding:0}li{margin:3px 0}code{background:var(--elev);padding:1px 5px;border-radius:4px;font-size:12px}
@media(max-width:1200px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){#side{position:fixed;z-index:30;height:100vh;transform:translateX(-100%)}#side.o{transform:none;width:224px}.g6,.g4,.g3,.g2{grid-template-columns:1fr 1fr}#view{padding:12px}}
@media(max-width:520px){.g6,.g4,.g3,.g2{grid-template-columns:1fr}}
@media print{#side,#top .btn{display:none}body{background:#fff;color:#000}}

  lineChart($("#k3"), {x: S.dates, series: [{name: "Posisi", color: COL.acc2, y: S.npos}], fmt: x => nf(x, 0), tfmt: x => nf(x, 0), h: 220, zero: true});
